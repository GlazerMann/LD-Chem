version: 2

updates:
  # Keep GitHub Actions current while grouping routine updates.
  # Major Action upgrades remain separate pull requests for easier review.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    cooldown:
      default-days: 5

    groups:
      github-actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python version updates are intentionally not configured here yet.
  # pyproject.toml currently leaves most runtime dependencies unconstrained and
  # the repository has no Python lock/constraints file, so there is no stable
  # declared version for Dependabot to advance. Re-enable the pip ecosystem
  # after the project adopts explicit dependency bounds or a reviewed lockfile.
  # Keep scientific runtime libraries individually reviewable rather than
  # grouping unrelated numerical-library upgrades into one pull request.
