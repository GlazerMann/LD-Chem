version: 2

updates:
  # Keep GitHub Actions current while grouping routine updates.
  # Major Action upgrades remain separate pull requests for easier review.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    cooldown:
      default-days: 5

    groups:
      github-actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep Python dependencies current while avoiding large catch-all
  # pull requests that mix major scientific-library upgrades together.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
